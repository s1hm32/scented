<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Invoice — Lumina Scents</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cream: '#F8F4EF',
            sand: '#E8DFD4',
            warm: '#C9A88A',
            gold: '#B8956A',
            deep: '#3D2C2E',
            plum: '#5C3A4A',
            sage: '#8A9A7B',
          },
          fontFamily: {
            serif: ['Playfair Display', 'Georgia', 'serif'],
            sans: ['Inter', 'system-ui', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    @media print {
      body { background: white !important; }
      .no-print { display: none !important; }
      .invoice-sheet { box-shadow: none !important; border: none !important; }
    }
  </style>
</head>
<body class="bg-cream text-deep font-sans antialiased min-h-screen">

  <!-- Top bar (hidden on print) -->
  <div class="no-print border-b border-sand bg-cream/90 backdrop-blur-md sticky top-0 z-10">
    <div class="max-w-3xl mx-auto px-4 py-4 flex items-center justify-between">
      <a href="index.html" class="font-serif text-xl text-deep hover:text-plum transition">
        Lumina <span class="text-gold italic">Scents</span>
      </a>
      <div class="flex items-center gap-3">
        <button onclick="window.print()" class="inline-flex items-center gap-2 px-4 py-2 text-sm border border-deep/20 rounded-sm hover:border-plum hover:text-plum transition">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z" />
          </svg>
          Print / Save PDF
        </button>
        <a href="index.html" class="text-sm text-deep/60 hover:text-plum transition">Back to shop</a>
      </div>
    </div>
  </div>

  <main class="py-10 md:py-16 px-4">
    <div id="invoice-container" class="max-w-3xl mx-auto">
      <!-- Content injected by JS -->
    </div>
  </main>

  <script>
    function formatPrice(n) {
      return '$' + Number(n).toFixed(2);
    }

    function formatDate(iso) {
      const d = new Date(iso);
      return d.toLocaleDateString('en-US', {
        year: 'numeric',
        month: 'long',
        day: 'numeric'
      });
    }

    function renderInvoice(order) {
      const container = document.getElementById('invoice-container');

      if (!order) {
        container.innerHTML = `
          <div class="bg-white border border-sand rounded-sm p-10 text-center">
            <p class="font-serif text-2xl mb-3">No invoice found</p>
            <p class="text-deep/60 text-sm mb-6">Complete a demo order first, then click “View Invoice”.</p>
            <a href="index.html#shop" class="inline-block px-6 py-3 bg-deep text-cream text-sm font-medium rounded-sm hover:bg-plum transition">
              Go to Shop
            </a>
          </div>
        `;
        return;
      }

      const itemsHtml = order.items.map(item => `
        <tr class="border-b border-sand">
          <td class="py-3 pr-4">
            <p class="font-medium text-sm">${item.name}</p>
          </td>
          <td class="py-3 px-4 text-center text-sm text-deep/70">${item.qty}</td>
          <td class="py-3 px-4 text-right text-sm text-deep/70">${formatPrice(item.price)}</td>
          <td class="py-3 pl-4 text-right text-sm font-medium">${formatPrice(item.price * item.qty)}</td>
        </tr>
      `).join('');

      container.innerHTML = `
        <div class="invoice-sheet bg-white border border-sand rounded-sm shadow-sm overflow-hidden">
          <!-- Header -->
          <div class="bg-deep text-cream px-8 py-8 md:px-10 md:py-10">
            <div class="flex flex-col sm:flex-row sm:items-start sm:justify-between gap-6">
              <div>
                <p class="font-serif text-2xl md:text-3xl tracking-tight">
                  Lumina <span class="text-gold italic">Scents</span>
                </p>
                <p class="text-cream/50 text-sm mt-2">Handcrafted fragrances & candles</p>
              </div>
              <div class="sm:text-right">
                <p class="text-xs uppercase tracking-widest text-gold mb-1">Invoice</p>
                <p class="font-mono text-lg">${order.ref}</p>
                <p class="text-cream/50 text-sm mt-1">${formatDate(order.date)}</p>
              </div>
            </div>
          </div>

          <!-- Addresses -->
          <div class="px-8 py-8 md:px-10 grid sm:grid-cols-2 gap-8 border-b border-sand">
            <div>
              <p class="text-xs uppercase tracking-wider text-deep/50 mb-2">Bill To</p>
              <p class="font-medium">${order.customer.fullName}</p>
              <p class="text-sm text-deep/70 mt-1">${order.customer.email}</p>
              <p class="text-sm text-deep/70 mt-1">
                ${order.customer.street}<br>
                ${order.customer.city}, ${order.customer.postal}
              </p>
            </div>
            <div class="sm:text-right">
              <p class="text-xs uppercase tracking-wider text-deep/50 mb-2">From</p>
              <p class="font-medium">Lumina Scents</p>
              <p class="text-sm text-deep/70 mt-1">123 Aroma Lane</p>
              <p class="text-sm text-deep/70">Scent City, SC 10001</p>
              <p class="text-sm text-deep/70">hello@luminascents.demo</p>
            </div>
          </div>

          <!-- Line items -->
          <div class="px-8 py-6 md:px-10">
            <table class="w-full">
              <thead>
                <tr class="text-xs uppercase tracking-wider text-deep/50 border-b border-sand">
                  <th class="py-3 pr-4 text-left font-medium">Item</th>
                  <th class="py-3 px-4 text-center font-medium">Qty</th>
                  <th class="py-3 px-4 text-right font-medium">Unit Price</th>
                  <th class="py-3 pl-4 text-right font-medium">Amount</th>
                </tr>
              </thead>
              <tbody>
                ${itemsHtml}
              </tbody>
            </table>
          </div>

          <!-- Totals -->
          <div class="px-8 py-6 md:px-10 border-t border-sand">
            <div class="max-w-xs ml-auto space-y-2 text-sm">
              <div class="flex justify-between">
                <span class="text-deep/60">Subtotal</span>
                <span>${formatPrice(order.subtotal)}</span>
              </div>
              <div class="flex justify-between">
                <span class="text-deep/60">Shipping</span>
                <span>${order.shipping === 0 ? 'Free' : formatPrice(order.shipping)}</span>
              </div>
              ${order.shipping === 0 ? '<p class="text-xs text-sage text-right">Free shipping on orders over $100</p>' : ''}
              <div class="flex justify-between pt-2 border-t border-sand font-medium text-base">
                <span>Total</span>
                <span class="font-serif text-lg">${formatPrice(order.total)}</span>
              </div>
            </div>
          </div>

          <!-- Footer notes -->
          <div class="px-8 py-6 md:px-10 bg-sand/40 border-t border-sand">
            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 text-sm text-deep/60">
              <div>
                <p class="font-medium text-deep mb-1">Payment Method</p>
                <p>Simulated card payment (demo only — no real charge)</p>
              </div>
              <div class="sm:text-right">
                <p class="text-xs uppercase tracking-wider text-deep/40 mb-1">Thank you</p>
                <p class="font-serif text-deep italic">Light. Scent. Atmosphere.</p>
              </div>
            </div>
          </div>
        </div>

        <p class="no-print text-center text-xs text-deep/40 mt-6">
          This is a demonstration invoice. No real transaction occurred.
        </p>
      `;
    }

    // Load last order
    const raw = localStorage.getItem('lumina-last-order');
    let order = null;
    try {
      order = raw ? JSON.parse(raw) : null;
    } catch (e) {
      order = null;
    }
    renderInvoice(order);
  </script>
</body>
</html>
